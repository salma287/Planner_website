<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JoyPlanner - Registration</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --dark-bg: #1a1a1a;
        --primary: #3d3d9b;
        --light-accent: #e8d7f1;
        --dark-accent: #4a3f64;
        --secondary: #b79bb5;
        --title-color: #2e00ff;
        --highlight: #9b6aff;
        --text-dark: #555;
        --text-light: #777;
        --pink-bg: #fce9f1;
        --dark-blue: #3d3b6d;
        --light-gray: #ccc;
        --semi-transparent: #a3b1cfad;

        /* Mood colors */
        --happy: #ff9e9e;
        --neutral: #a7bbc7;
        --sad: #9ea1ff;
        --excited: #ffd166;
        --tired: #b8b8ff;
      }

      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: var(--dark-bg);
        padding: 20px;
        color: white;
        transition: background 0.5s ease;
        background: #1a1a3d;
      }

      /* Mood-based body colors */
      body.happy {
        background: #3d1a3d;
      }
      body.neutral {
        background: #1a3d3d;
      }
      body.sad {
        background: #1a1a3d;
      }
      body.excited {
        background: #3d3d1a;
      }
      body.tired {
        background: #3d1a3d;
      }

      .registration-card {
        width: 100%;
        max-width: 600px;
        background: var(--dark-accent);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        transition: all 0.5s ease;
        position: relative;
      }

      /* Mood-based card accents */
      .registration-card.happy {
        border: 2px solid var(--happy);
        box-shadow: 0 10px 30px rgba(255, 158, 158, 0.3);
      }
      .registration-card.neutral {
        border: 2px solid var(--neutral);
        box-shadow: 0 10px 30px rgba(167, 187, 199, 0.3);
      }
      .registration-card.sad {
        border: 2px solid var(--sad);
        box-shadow: 0 10px 30px rgba(158, 161, 255, 0.3);
      }
      .registration-card.excited {
        border: 2px solid var(--excited);
        box-shadow: 0 10px 30px rgba(255, 209, 102, 0.3);
      }
      .registration-card.tired {
        border: 2px solid var(--tired);
        box-shadow: 0 10px 30px rgba(184, 184, 255, 0.3);
      }

      .registration-card:hover {
        transform: translateY(-5px);
      }

      .registration-header {
        padding: 30px;
        text-align: center;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--dark-accent) 100%
        );
        position: relative;
        overflow: hidden;
      }

      /* Mood-based header colors */
      .registration-header.happy {
        background: linear-gradient(135deg, #9e3d9e 0%, #ff9e9e 100%);
      }
      .registration-header.neutral {
        background: linear-gradient(135deg, #3d9e9e 0%, #a7bbc7 100%);
      }
      .registration-header.sad {
        background: linear-gradient(135deg, #3d3d9e 0%, #9ea1ff 100%);
      }
      .registration-header.excited {
        background: linear-gradient(135deg, #9e9e3d 0%, #ffd166 100%);
      }
      .registration-header.tired {
        background: linear-gradient(135deg, #9e3d9e 0%, #b8b8ff 100%);
      }

      .registration-header::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          to bottom right,
          transparent 45%,
          rgba(255, 255, 255, 0.1) 50%,
          transparent 55%
        );
        animation: shine 6s infinite;
        z-index: 0;
      }

      .logo-container {
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        animation: pulse 3s infinite;
      }

      .logo-icon {
        font-size: 36px;
        color: white;
        animation: float 3s ease-in-out infinite;
      }

      .registration-header h1 {
        font-size: 28px;
        margin-bottom: 10px;
        position: relative;
        z-index: 1;
        background: linear-gradient(to right, white, var(--light-accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .registration-header p {
        font-size: 14px;
        opacity: 0.9;
        position: relative;
        z-index: 1;
      }

      .registration-form {
        padding: 30px;
        position: relative;
        transition: all 0.5s ease;
      }

      /* Mood-based form backgrounds */
      .registration-form.happy {
        background: rgba(74, 15, 74, 0.8);
      }
      .registration-form.neutral {
        background: rgba(15, 74, 74, 0.8);
      }
      .registration-form.sad {
        background: rgba(15, 15, 74, 0.8);
      }
      .registration-form.excited {
        background: rgba(74, 74, 15, 0.8);
      }
      .registration-form.tired {
        background: rgba(74, 15, 74, 0.8);
      }

      .form-group {
        margin-bottom: 20px;
        position: relative;
      }

      .form-row {
        display: flex;
        gap: 15px;
      }

      .form-row .form-group {
        flex: 1;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
        color: var(--light-accent);
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 12px 15px 12px 40px;
        border: 1px solid var(--secondary);
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.3s;
        background: rgba(30, 30, 30, 0.7);
        color: white;
      }

      .form-group input:focus,
      .form-group select:focus {
        border-color: white;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        outline: none;
      }

      .form-group i {
        position: absolute;
        left: 15px;
        top: 35px;
        color: var(--secondary);
        transition: all 0.3s;
      }

      .form-group input:focus + i,
      .form-group select:focus + i {
        color: white;
        transform: scale(1.1);
      }

      /* Emotion Selector */
      .emotion-section {
        margin: 25px 0;
        text-align: center;
      }

      .emotion-section h3 {
        font-size: 15px;
        color: var(--light-accent);
        margin-bottom: 15px;
        font-weight: 500;
      }

      .emotion-options {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 15px;
        flex-wrap: wrap;
      }

      .emotion-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(30, 30, 30, 0.7);
        border: 2px solid transparent;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--light-accent);
      }

      /* Mood-based button colors */
      .emotion-btn.happy {
        color: var(--happy);
      }
      .emotion-btn.neutral {
        color: var(--neutral);
      }
      .emotion-btn.sad {
        color: var(--sad);
      }
      .emotion-btn.excited {
        color: var(--excited);
      }
      .emotion-btn.tired {
        color: var(--tired);
      }

      .emotion-btn:hover {
        transform: scale(1.1) translateY(-3px);
        box-shadow: 0 3px 10px rgba(255, 255, 255, 0.2);
        border-color: currentColor;
      }

      .emotion-btn.active {
        background: currentColor;
        color: white;
        border-color: white;
        box-shadow: 0 0 10px currentColor;
      }

      /* Affirmation message */
      .affirmation {
        font-size: 14px;
        color: white;
        font-weight: 500;
        margin-top: 10px;
        min-height: 20px;
        opacity: 0;
        transform: translateY(5px);
        transition: all 0.3s ease;
        font-style: italic;
      }

      .affirmation.show {
        opacity: 1;
        transform: translateY(0);
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(to right, var(--primary), var(--highlight));
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 20px;
        box-shadow: 0 4px 15px rgba(155, 106, 255, 0.4);
        position: relative;
        overflow: hidden;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(155, 106, 255, 0.6);
      }

      .submit-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: 0.5s;
      }

      .submit-btn:hover::before {
        left: 100%;
      }

      .form-footer {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: var(--light-accent);
      }

      .form-footer a {
        color: white;
        text-decoration: none;
        border-bottom: 1px solid var(--secondary);
        transition: all 0.3s;
      }

      .form-footer a:hover {
        color: var(--highlight);
        border-bottom-color: var(--highlight);
      }

      @keyframes shine {
        0% {
          transform: rotate(0deg) translate(-30%, -30%);
        }
        100% {
          transform: rotate(360deg) translate(-30%, -30%);
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      @media (max-width: 600px) {
        .form-row {
          flex-direction: column;
          gap: 0;
        }

        .registration-header {
          padding: 25px 20px;
        }

        .registration-form {
          padding: 25px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="registration-card" id="registrationCard">
      <div class="registration-header" id="registrationHeader">
        <div class="logo-container">
          <i class="fas fa-calendar-alt logo-icon"></i>
        </div>
        <h1>Login To Your Account</h1>
        <p>Join JoyPlanner to organize your life with joy</p>
      </div>

      <div class="registration-form">
        <form id="loginForm"
          <div class="form-group">
            <label for="email">Email Address</label>
            <i class="fas fa-envelope"></i>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="your.email@example.com"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <i class="fas fa-lock"></i>
            <input
              type="password"
              id="password"
              name="mot_de_passe"
              placeholder="Create a password"
            />
          </div>

          <button type="submit" class="submit-btn">
            <i class="fas fa-user-plus"></i> Login
          </button>

          <div class="form-footer">
            Don't have an account yet ? <a href="#">SignUp</a>
          </div>
        </form>
      </div>
    </div>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          if (!email || !password) {
            alert("Please fill in all fields");
            return;
          }

          try {
            const response = await fetch(
              "http://localhost:4000/api/users/login",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ email, password }),
              }
            );

            const data = await response.json();

            if (response.ok) {
              alert("Login successful!");
              localStorage.setItem("token", data.token); // save JWT for later use
              // Redirect to a protected page (if you have one)
              // window.location.href = 'dashboard.html';
            } else {
              alert(data.message || "Login failed");
            }
          } catch (error) {
            console.error("Login error:", error);
            alert("Server error. Please try again later.");
          }
        });
    </script>
  </body>
</html>
