<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoyPlanner - Weekly</title>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/main.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales/fr.js"></script>

  <!-- Fonts & Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="sidebar">
    <h1>JoyPlanner</h1>
    <ul class="sidebar-nav">
      <li><a href="#">📅 Daily</a></li>
      <li><a href="#" class="active">🗓️ Weekly</a></li>
      <li><a href="#">📆 Monthly</a></li>
      <li><a href="#">📊 Stats</a></li>
    </ul>
  </div>

  <div class="main-content">
    <div class="topbar">
      <button id="auth-button" class="signin-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18" height="18">
        Se connecter
      </button>

      <button id="logout-button" class="logout-btn">🚪 Déconnexion</button>

    </div>



    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- Calendrier -->
    <div class="calendar-wrapper">
      <div id="loading" class="loading">Chargement du calendrier...</div>
      <div id="events-placeholder" class="events-placeholder">Connectez-vous pour voir votre calendrier</div>
      <div id="calendar" style="display: none;"></div>
    </div>

    <!-- Fenêtre modale d'ajout d'événement -->
    <div id="event-modal" class="modal">
      <div class="modal-content">
        <h2>Nouvel Événement</h2>
        <input type="text" id="event-title" placeholder="Titre de l'événement" />
        <div class="modal-buttons">
          <button id="save-event-btn">Enregistrer</button>
          <button id="cancel-event-btn">Annuler</button>
        </div>
      </div>
    </div>
    
    </div>

  </div>

  <script src="main.js"></script>
</body>
</html>
