<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIR PORTAL - Reset Password</title>
  <link rel="stylesheet" href="reset_password.css" />
</head>
<body>
  <div class="container">
    <h1>Reset your password</h1>

    <form id="resetForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required />
        <div class="field-error" id="error-email"></div>
      </div>

      <div class="form-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" placeholder="Enter a new password" required />
        <div class="field-error" id="error-new-password"></div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" placeholder="Confirm your new password" required />
        <div class="field-error" id="error-confirm-password"></div>
      </div>

      <button type="submit" class="btn">Reset Password</button>
    </form>

    <div id="result"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
